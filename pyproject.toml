[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "branchlab"
version = "0.2.0"
description = "From-scratch language models and reproducible training-diagnostic program experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3", "pyarrow>=15,<24"]

[project.urls]
Repository = "https://github.com/liyuqin606-del/branchlab"
Issues = "https://github.com/liyuqin606-del/branchlab/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "matplotlib>=3.8,<4"]
demo = ["gradio>=5,<7"]

[project.scripts]
branchlab = "branchlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
